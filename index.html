<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit — Statistiques réseaux sociaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efeb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a897f;
  --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --side:#121212; --side-ink:#d9d8d2; --side-mute:#8d8c85; --side-hover:#1f1f1e; --side-active:#2a2a28;
  --s-fb:#2a78d6; --s-ig:#eb6834; --s-tt:#1baf7a; --s-li:#eda100; --s-yt:#e87ba4;
  --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c7:#6250d6;
  --good:#006300; --bad:#d03b3b;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95; --seq7:#0d366b;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* Sidebar */
aside{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px;font-weight:700;font-size:17px;color:#fff;letter-spacing:-.01em}
.logo-mark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,#2a78d6,#eb6834,#2a78d6);display:grid;place-items:center}
.logo-mark::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--side)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;cursor:pointer;font-weight:500}
.nav a:hover{background:var(--side-hover)}
.nav a.on{background:var(--side-active);color:#fff}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.side-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-mute);padding:0 10px;display:flex;justify-content:space-between;align-items:center}
.side-h button{background:none;border:0;color:var(--side-mute);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.side-h button:hover{color:#fff}
.side-search{margin:0 4px;padding:7px 10px;border-radius:8px;border:1px solid #2c2c2a;background:#1a1a19;color:#fff;width:calc(100% - 8px)}
.brands{display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer}
.brand:hover{background:var(--side-hover)}
.brand.on{background:var(--side-active)}
.brand .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.brand .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:#eee}
.brand .nets{display:flex;gap:3px}
.nb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:9px;font-weight:700;color:#fff;flex:none}
.nb.ig{background:var(--s-ig)}.nb.fb{background:var(--s-fb)}.nb.tt{background:var(--s-tt)}.nb.li{background:var(--s-li);color:#0b0b0b}.nb.yt{background:var(--s-yt)}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid #262624;font-size:12px;color:var(--side-mute)}
/* Main */
main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,244,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:10px}
.topbar h1 .av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.ctl{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.ctl select,.ctl input{border:0;background:none;outline:none;cursor:pointer}
.ctl input[type=date]{width:128px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink-2);font-weight:500;user-select:none}
.toggle input{display:none}
.toggle .sw{width:30px;height:18px;border-radius:9px;background:var(--axis);position:relative;transition:.15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+.sw{background:var(--ink)}
.toggle input:checked+.sw::after{left:14px}
.content{padding:24px 28px 60px;display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}
.period-note{font-size:13px;color:var(--ink-2)}
.period-note b{color:var(--ink);font-weight:600}
/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px;font-weight:600}
.card .sub{color:var(--ink-3);font-size:12.5px;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.card-h .sub{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.up{color:var(--good);font-weight:600}.down{color:var(--bad);font-weight:600}.flat{color:var(--ink-2);font-weight:600}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.chart-box.lg{height:300px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* Tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--ink-2);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
th.sorted{color:var(--ink)}
td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.grp td{background:#f7f7f4;font-weight:600}
tr.grp:hover td{background:var(--surface-2)}
.acc-cell{display:flex;align-items:center;gap:8px}
.acc-cell .av{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.muted{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:500}
.pill.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:#0ca30c}
.pill.warn::before{content:"";width:6px;height:6px;border-radius:50%;background:#fab219}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--axis)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#2a2a28}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Heatmap */
.heat{display:grid;grid-template-columns:30px repeat(24,minmax(0,1fr));gap:2px;font-size:10.5px;color:var(--ink-3)}
.heat .c{height:16px;border-radius:3px}
.heat .c:hover{outline:2px solid var(--ink);outline-offset:1px}
.heat .rl{display:flex;align-items:center}
.heat .hl{text-align:center}
.scale{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);margin-top:10px}
.scale i{width:18px;height:10px;border-radius:2px;display:inline-block}
/* Posts */
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/10;position:relative;display:flex;align-items:flex-end;padding:10px;color:#fff}
.thumb .tp{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:99px;font-size:11.5px;font-weight:600}
.thumb .nbx{position:absolute;top:10px;right:10px}
.thumb .rank{font-size:12px;font-weight:600;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:99px}
.post .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.post .cap{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.post .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}
.post .meta div{display:flex;flex-direction:column}
.post .meta b{font-size:14px;font-variant-numeric:tabular-nums}
.post .meta span{color:var(--ink-3)}
.post .date{font-size:12px;color:var(--ink-3)}
/* Bars list */
.bars{display:flex;flex-direction:column;gap:10px}
.bars .row{display:grid;grid-template-columns:130px 1fr 56px;align-items:center;gap:10px;font-size:13px}
.bars .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bars .fill{height:100%;background:var(--s-fb);border-radius:0 5px 5px 0}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
/* Forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input[type=text],.field input[type=date],.field select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);outline:none}
.field input:focus,.field select:focus{border-color:var(--ink)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Report doc */
.report-wrap{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.report-side{position:sticky;top:84px}
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:40px 44px;display:flex;flex-direction:column;gap:26px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.doc-cover{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:20px}
.doc-cover h2{font-size:26px;margin:6px 0 4px;letter-spacing:-.02em}
.doc-cover .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600}
.doc h4{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.doc h4 .n{width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
.insights{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface-2);border-radius:9px;font-size:13.5px;line-height:1.5}
.insights li .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--ink)}
.empty{padding:50px 20px;text-align:center;color:var(--ink-3)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--surface-2);font-size:13px;cursor:pointer}
.alert:hover{background:#e9e8e3}
.alert .ic{flex:none;font-weight:700;width:20px;text-align:center}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal h3{margin:0;font-size:18px}
.net-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.net-tile{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--surface)}
.net-tile:hover{border-color:var(--ink)}
.net-tile.dis{opacity:.5;cursor:not-allowed}
.net-tile.dis:hover{border-color:var(--line)}
.net-tile .nb{width:30px;height:30px;font-size:12px;border-radius:8px}
.net-tile b{font-size:14px}
.net-tile span{font-size:12px;color:var(--ink-3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;transition:.2s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
#tip{position:fixed;z-index:150;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;pointer-events:none;display:none;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.sched{display:flex;flex-direction:column;gap:8px}
.sched .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px}
.camp{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.camp:last-child{border-bottom:0}
.camp .nm{font-weight:600}
.camp .k{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.camp .k span{font-size:12px;color:var(--ink-3)}
.camp .k b{font-size:15px}
.spark{display:block}
.boot{position:fixed;inset:0;background:var(--bg);z-index:300;place-items:center;padding:24px;overflow:auto}
.boot-wrap{width:min(860px,100%)}
.boot-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.boot-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px}
.boot-card h3{margin:0;font-size:17px}
.boot-card p{margin:0;line-height:1.5}
.fb-btn{background:#1877f2;border-color:#1877f2;justify-content:center;padding:11px 16px}
.fb-btn:hover{background:#166fe5}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){.boot-grid{grid-template-columns:1fr}}
.client-bar{background:#fff4d6;border-bottom:1px solid #f0d27a;padding:10px 28px;display:flex;gap:10px;align-items:center;font-size:13.5px}
.client-bar span{margin-right:auto}
.user-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px}
@media (max-width:1100px){.g2,.g3,.g32,.report-wrap{grid-template-columns:1fr}.report-side{position:static}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.content{padding:16px}.topbar{padding:10px 16px}.camp{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><div class="logo-mark"></div>Orbit</div>
    <nav class="nav" id="nav"></nav>
    <div>
      <div class="side-h">Mes marques <button id="addBrandBtn" title="Ajouter une marque" onclick="openAddBrand()">+</button></div>
      <div style="height:8px"></div>
      <input class="side-search" id="brandSearch" placeholder="Rechercher une marque…" oninput="renderBrands()">
      <div style="height:8px"></div>
      <div class="brands" id="brands"></div>
    </div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main>
    <div id="clientBar"></div>
    <div class="topbar" id="topbar"></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="boot" class="boot" style="display:none"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="tip"></div>

<script>
/* ============================== Utilitaires ============================== */
const DAY = 864e5;
const _now = new Date();
const END = Date.UTC(_now.getUTCFullYear(),_now.getUTCMonth(),_now.getUTCDate()-1); // hier = dernier jour complet
const START = END - 730*864e5; // 2 ans d'historique
const N = Math.round((END-START)/DAY)+1;
const T = N-1;
const dayDate = i => new Date(START+i*DAY);
const iso = i => dayDate(i).toISOString().slice(0,10);
const idx = s => Math.round((Date.parse(s+'T00:00:00Z')-START)/DAY);
const clampI = i => Math.max(0,Math.min(T,i));
let LOC = 'fr'; const LOCALE = {fr:'fr-FR',en:'en-GB'};
function withLoc(l,f){ const o=LOC; LOC=l||'fr'; try{ return f(); } finally { LOC=o; } }
const fmt = n => Math.round(n).toLocaleString(LOCALE[LOC]);
const fmtC = n => { const a=Math.abs(n), sp=LOC==='en'?'':' '; if(a>=1e6) return (n/1e6).toLocaleString(LOCALE[LOC],{maximumFractionDigits:1})+sp+'M'; if(a>=1e4) return (n/1e3).toLocaleString(LOCALE[LOC],{maximumFractionDigits:1})+sp+'k'; return fmt(n); };
const pct = (n,d=1) => (n*100).toLocaleString(LOCALE[LOC],{minimumFractionDigits:d,maximumFractionDigits:d})+(LOC==='en'?'%':' %');
const num = (n,d=1) => n.toLocaleString(LOCALE[LOC],{minimumFractionDigits:d,maximumFractionDigits:d});
const fd = (i,o) => dayDate(i).toLocaleDateString(LOCALE[LOC],Object.assign({timeZone:'UTC'},o||{day:'numeric',month:'short',year:'numeric'}));
/* Traductions des rapports (clé = texte français) */
const EN = {
  'Abonnés':'Followers','Nouveaux abonnés':'New followers','Portée':'Reach','Vues':'Views','Interactions':'Interactions',
  "Taux d'engagement":'Engagement rate','Publications':'Posts','Visites du profil':'Profile visits','Clics vers le site':'Website clicks',
  'sur la période':'over the period','— pas de période de comparaison':'— no comparison period',
  'Synthèse':'Summary',"Évolution de l'audience":'Audience growth','Portée & vues':'Reach & views','Engagement':'Engagement',
  'Performance par format':'Performance by format','Top publications':'Top posts','Analyse & recommandations':'Analysis & recommendations',
  "J'aime":'Likes',"J'aime / réactions":'Likes / reactions','Commentaires':'Comments','Partages':'Shares','Enregistrements':'Saves',
  'Portée par':'Reach per','Vues par':'Views per','jour':'day','semaine':'week','mois':'month',
  'Format':'Format','Portée moy.':'Avg. reach','Interactions moy.':'Avg. interactions',"Taux d'eng.":'Eng. rate','Publication':'Post','Date':'Date',
  'Aucune publication.':'No posts.','Aucune publication sur cette période.':'No posts in this period.',

function genAccount(ent, acc){
  const r = rng(hashStr(acc.id));
  const D = {}; KEYS.forEach(k=>D[k]=new Float64Array(N));
  const posts = [];
  let f = acc.base; const phase = r()*6.28;
  const camps = ent.campaigns.map(c=>({id:c.id,a:idx(c.start),b:idx(c.end)}));
  const types = TYPES[acc.net]; const caps = CAPTIONS[ent.theme]||CAPTIONS.food;
  for(let i=0;i<N;i++){
    const wd = dayDate(i).getUTCDay();
    const camp = camps.find(c=>i>=c.a&&i<=c.b);
    const boost = camp?1.55:1;
    const season = 1+.22*Math.sin(2*Math.PI*i/365+phase);
    const noise = ()=>.75+r()*.5;
    const p = acc.freq/7*(camp?1.5:1);
    let np = r()<p?1:0; if(r()<p*.22) np++;
    let pr=0,it=0,li=0,co=0,sh=0,sv=0,vv=0;
    for(let k=0;k<np;k++){
      let x=r()*types.reduce((a,t)=>a+t.w,0), t=types[0]; for(const ty of types){ if(x<ty.w){t=ty;break} x-=ty.w; }
      const viral = r()<.05?2.6+r()*2:1;
      const reach = Math.round(t.m*f*acc.reach*season*boost*(.5+r()*1.1)*viral);
      const er = acc.eng*t.e*(.6+r()*.9);
      const inter = Math.round(reach*er);
      const c = Math.round(inter*(.05+r()*.05)), s = Math.round(inter*(acc.net==='ig'?.04:.13)*(.6+r()*.8));
      const sa = acc.net==='ig'?Math.round(inter*(.07+r()*.08)):0;
      const l = Math.max(0,inter-c-s-sa);
      const vid = t.v?Math.round(reach*(1.3+r()*1.2)):0;
      const hours=[7,8,11,12,13,17,18,19,20,21];
      posts.push({id:acc.id+'-'+i+'-'+k,acc:acc.id,net:acc.net,ent:ent.id,day:i,hour:hours[Math.floor(r()*hours.length)],type:t.k,
        cap:caps[Math.floor(r()*caps.length)],reach,impr:Math.round(reach*(1.12+r()*.4)),likes:l,comments:c,shares:s,saves:sa,inter,er:reach?inter/reach:0,video:vid,camp:camp?camp.id:null,hue:Math.floor(r()*360)});
      pr+=reach; it+=inter; li+=l; co+=c; sh+=s; sv+=sa; vv+=vid;
    }
    const amb = f*acc.reach*.3*season*boost*noise()*((wd===0||wd===6)?1.12:1);
    const ambInter = Math.round(amb*acc.eng*.1);
    D.reach[i] = Math.round(amb+pr*.8);
    D.impr[i] = Math.round(D.reach[i]*(1.35+r()*.35));
    D.inter[i] = it+ambInter; D.likes[i]=li+ambInter; D.comments[i]=co; D.shares[i]=sh; D.saves[i]=sv; D.video[i]=vv; D.posts[i]=np;
    const g = Math.max(0,Math.round(Math.abs(f*acc.growth)*noise()*boost*(1+np*.3)+f*.0004*r()));
    const lo = Math.round(acc.growth<0 ? g+Math.abs(f*acc.growth)*1.6*noise() : g*(.22+r()*.2));
    f += g-lo; D.gained[i]=g; D.lost[i]=lo; D.followers[i]=Math.round(f);
    D.visits[i] = Math.round(D.reach[i]*(.022+r()*.018));
    D.clicks[i] = Math.round(D.visits[i]*(.07+r()*.06));
  }
  DATA[acc.id]=D; POSTS[acc.id]=posts;
}

function legend(items){ return `<div class="legend">${items.map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
async function copy(text,msg){ try{ await navigator.clipboard.writeText(text); toast(msg||'Copié dans le presse-papiers'); }catch(e){ openModal(`<h3>Copier manuellement</h3><p class="muted">Le presse-papiers n'est pas accessible ici. Sélectionnez le texte ci-dessous :</p><textarea style="width:100%;height:260px;font-family:monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px">${esc(text)}</textarea><div style="text-align:right"><button class="btn" onclick="closeModal()">Fermer</button></div>`); } }

/* ============================== Charts ============================== */
const CH = {};
function destroyCharts(){ Object.keys(CH).forEach(k=>{CH[k].destroy();delete CH[k]}); }
function baseOpts(extra={}){
  const grid=css('--line'), ink2=css('--ink-2'), L=LOC;
  return Object.assign({
    responsive:true, maintainAspectRatio:false, animation:{duration:250},
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},tooltip:{backgroundColor:'#0b0b0b',titleFont:{weight:'600'},padding:10,cornerRadius:8,boxPadding:4,
      callbacks:{label:c=>withLoc(L,()=>` ${c.dataset.label} : ${c.dataset._fmt?c.dataset._fmt(c.raw):fmt(c.raw)}`)}}},
    scales:{x:{grid:{display:false},border:{color:css('--axis')},ticks:{color:ink2,maxRotation:0,autoSkip:true,maxTicksLimit:8,font:{size:11}}},
            y:{grid:{color:grid},border:{display:false},ticks:{color:ink2,font:{size:11},callback:v=>withLoc(L,()=>fmtC(v)),maxTicksLimit:6}}}
  },extra);
}
function mkChart(id,cfg){ const el=document.getElementById(id); if(!el) return; if(CH[id]) CH[id].destroy(); CH[id]=new Chart(el,cfg); }
function lineDS(label,data,color,extra={}){ return Object.assign({label,data,borderColor:color,backgroundColor:color,borderWidth:2,pointRadius:0,pointHoverRadius:4,pointHoverBorderColor:'#fff',pointHoverBorderWidth:2,tension:.3},extra); }
function barDS(label,data,color,extra={}){ return Object.assign({label,data,backgroundColor:color,borderRadius:3,borderSkipped:false,borderColor:css('--surface'),borderWidth:{top:1,bottom:0,left:0,right:0},maxBarThickness:28},extra); }

/* ============================== Rendu global ============================== */
function render(){
  if(location.hash.slice(1)!==S.view) history.replaceState(null,'','#'+S.view);
  if(isClient()&&!allowed(S.view)){ S.view=clientCfg(S.client).views[0]||'analytics'; }
  if(isClient()) S.entity=S.client;
  destroyCharts(); renderNav(); renderBrands(); renderTop(); renderClientBar();
  const v=document.getElementById('view');
  const fn={overview:vOverview,analytics:vAnalytics,posts:vPosts,audience:vAudience,campaigns:vCampaigns,reports:vReports,accounts:vAccounts,diagnostic:vDiagnostic}[S.view]||vOverview;
  if(LIVE.on && (S.view!=='reports'||(S.report&&S.report.generated))){
    const need=neededLoads(); const needDemo = S.view==='audience' && ent().demo===undefined;
    if(need.length||needDemo||LIVE.busy){ v.innerHTML=loadingCard(); if(!LIVE.busy) runLoads(need); return; }
  }
  fn(v);
}
function go(view,entity){
  if(isClient()){ entity=S.client; if(!allowed(view)) view=clientCfg(S.client).views[0]||'analytics'; }
  if(entity) S.entity=entity; S.view=view; render(); window.scrollTo(0,0); }
function enterClient(id){ closeModal(); S.client=id; const u=clientCfg(id).users[0]; S.report=null; S.entity=id; S.report=defaultReport(); if(u) S.report.lang=u.lang; S.entity=id; S.nets={ig:true,fb:true,tt:false,li:false,yt:false}; if(S.report) S.report.entity=id; go(clientCfg(id).views[0]||'analytics',id); toast('Aperçu de l\'espace client'); }
function exitClient(){ const id=S.client; S.client=null; go('accounts'); }
function renderNav(){
  document.getElementById('nav').innerHTML = VIEWS.filter(v=>v.id==='diagnostic'?(LIVE.on&&!isClient()):true).filter(v=>isClient()?(v.id!=='overview'&&v.id!=='accounts'&&allowed(v.id)):true).map(v=>`<a class="${S.view===v.id?'on':''}" onclick="go('${v.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${v.ic}</svg>${v.l}</a>`).join('');
}
function initials(n){ return n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function renderBrands(){
  const q=(document.getElementById('brandSearch').value||'').toLowerCase();
  document.getElementById('brandSearch').style.display=isClient()?'none':'';
  document.getElementById('addBrandBtn').style.display=isClient()?'none':'';
  document.getElementById('sideFoot').innerHTML=isClient()?'Espace client · lecture seule<br>Données mises à jour chaque jour à 06:00':LIVE.on?`Connecté à Meta : ${esc((LIVE.user||{}).name||'')}<br><a href="#" style="color:#d9d8d2" onclick="event.preventDefault();liveLogout()">Se déconnecter</a>`:'Démo — données simulées.<br><a href="#" style="color:#d9d8d2" onclick="event.preventDefault();bootWelcome()">Connecter mes vrais comptes →</a>';
  document.getElementById('brands').innerHTML = ENTITIES.filter(e=>isClient()?e.id===S.client:e.name.toLowerCase().includes(q)).map(e=>`
    <div class="brand ${ENTITY_VIEWS.includes(S.view)&&S.entity===e.id?'on':''}" onclick="go('${ENTITY_VIEWS.includes(S.view)?S.view:'analytics'}','${e.id}')" title="Ouvrir les statistiques de ${esc(e.name)}">
      <div class="av" style="background:${e.color}">${initials(e.name)}</div><div class="nm">${esc(e.name)}</div>
      <div class="nets">${[...new Set(e.accounts.map(a=>a.net))].map(nb).join('')}</div></div>`).join('') || '<div style="padding:8px 10px;color:var(--side-mute);font-size:13px">Aucune marque</div>';
}
function renderClientBar(){
  const el=document.getElementById('clientBar');
  if(!isClient()){ el.innerHTML=''; return; }
  const e=ENTITIES.find(x=>x.id===S.client);
  el.innerHTML=`<div class="client-bar"><span>👁 Aperçu de l'espace client de <b>${esc(e.name)}</b> — c'est ce que verra votre client (lecture seule, sa marque uniquement).</span><button class="btn sm" onclick="openClientAccess('${e.id}')">Réglages d'accès</button><button class="btn sm pri" onclick="exitClient()">Quitter l'aperçu</button></div>`;
}
function renderTop(){
  const e=ent(); const isEnt=ENTITY_VIEWS.includes(S.view);
  const title = S.view==='overview'?'Vue d\'ensemble':S.view==='reports'?'Rapports':S.view==='accounts'?'Comptes connectés':
    `<span class="av" style="background:${e.color}">${initials(e.name)}</span>${esc(e.name)} <span class="muted" style="font-weight:500;font-size:14px">· ${VIEWS.find(v=>v.id===S.view).l}</span>`;
  const showPeriod = !['reports','accounts'].includes(S.view);
  const camps = isEnt?e.campaigns:[];
  const pk=S.period.key;
  document.getElementById('topbar').innerHTML = `<h1>${title}</h1>
    ${showPeriod?`<div class="seg" role="group" aria-label="Réseaux">
      ${Object.entries(NETS).map(([k,n])=>`<button class="${S.nets[k]?'on':''}" ${n.live?'':'disabled title="Bientôt disponible"'} onclick="toggleNet('${k}')">${nb(k)}${n.live?'':'<span style="font-size:11px">bientôt</span>'}</button>`).join('')}
    </div>
    <div class="ctl"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <select onchange="setPeriod(this.value)" aria-label="Période">
        ${PRESETS.map(p=>`<option value="${p.k}" ${pk===p.k?'selected':''}>${p.l}</option>`).join('')}
        ${camps.length?`<optgroup label="Campagnes">${camps.map(c=>`<option value="camp:${c.id}" ${pk==='camp:'+c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`:''}
      </select></div>
    ${pk==='custom'?`<div class="ctl"><input type="date" min="${iso(0)}" max="${iso(T)}" value="${S.custom.s}" onchange="S.custom.s=this.value;render()"> → <input type="date" min="${iso(0)}" max="${iso(T)}" value="${S.custom.e}" onchange="S.custom.e=this.value;render()"></div>`:''}
    <label class="toggle"><input type="checkbox" ${S.compare?'checked':''} onchange="S.compare=this.checked;render()"><span class="sw"></span>Comparer</label>`:''}`;
}
function toggleNet(k){ S.nets[k]=!S.nets[k]; if(!activeNets().length) S.nets[k]=true; render(); }
function setPeriod(v){ S.period.key=v; render(); }
function periodHeader(r){ const p=prevRange(r); return `<div class="period-note">Période : <b>${periodLabel(r)}</b> (${r.e-r.s+1} j)${S.compare?(p?` · comparée à ${periodLabel(p)}`:' · pas de données avant le 1er janv. 2025 pour comparer'):''}</div>`; }

/* ============================== Vue d'ensemble ============================== */
function vOverview(v){
  const r=R(), pr=prevRange(r); const accs=allAccs();
  const m=metrics(accs,r), p=pr&&metrics(accs,pr);
  // lignes
  const rows = ENTITIES.map(e=>{ const a=accsOf(e); if(!a.length) return null; const mm=metrics(a,r), pp=pr&&metrics(a,pr);
    return {e,m:mm,p:pp,subs:a.map(ac=>({a:ac,m:metrics([ac],r),p:pr&&metrics([ac],pr)}))}; }).filter(Boolean);
  const sk=S.ovSort; const val=(x)=>x.m[sk.k]; rows.sort((a,b)=>(val(a)-val(b))*sk.dir);
  const cols=[['followers','Abonnés'],['net','Évol. abonnés'],['reach','Portée'],['inter','Interactions'],['er','Taux d\'eng.'],['posts','Publications']];
  const bk=buckets({s:Math.max(0,r.e-29),e:r.e}).b;
  const cell=(mm,pp,k)=>k==='er'?pct(mm.er,2):k==='net'?`<span class="${mm.net>=0?'up':'down'}">${mm.net>=0?'+':''}${fmt(mm.net)}</span>`:fmtC(mm[k]);
  const dcell=(mm,pp)=> (S.compare&&pp&&pp.reach)? (()=>{const d=(mm.reach-pp.reach)/pp.reach;return `<span class="${d>=0?'up':'down'}" style="font-size:12px">${d>=0?'▲':'▼'} ${(Math.abs(d)*100).toFixed(0)} %</span>`})():'';
  // alertes
  const alerts=[];
  rows.forEach(x=>x.subs.forEach(s=>{
    if(!s.p) return;
    if(s.m.net<0) alerts.push({e:x.e,ic:'▼',c:'var(--bad)',t:`<b>${esc(x.e.name)}</b> · ${NETS[s.a.net].name} perd des abonnés (${fmt(s.m.net)} sur la période)`});
    if(s.p.er && (s.m.er-s.p.er)/s.p.er < -.15) alerts.push({e:x.e,ic:'▼',c:'var(--bad)',t:`<b>${esc(x.e.name)}</b> · ${NETS[s.a.net].name} : taux d'engagement en baisse (${pct(s.m.er,2)} vs ${pct(s.p.er,2)})`});
    if(s.p.reach && (s.m.reach-s.p.reach)/s.p.reach > .25) alerts.push({e:x.e,ic:'▲',c:'var(--good)',t:`<b>${esc(x.e.name)}</b> · ${NETS[s.a.net].name} : portée en forte hausse (+${((s.m.reach-s.p.reach)/s.p.reach*100).toFixed(0)} %)`});
    const lastPost = POSTS[s.a.id].filter(p=>p.day<=r.e).slice(-1)[0];
    if(lastPost && r.e-lastPost.day>7) alerts.push({e:x.e,ic:'!',c:'#b07a00',t:`<b>${esc(x.e.name)}</b> · ${NETS[s.a.net].name} : aucune publication depuis ${r.e-lastPost.day} jours`});
  }));
  v.innerHTML = `${periodHeader(r)}
    ${kpiTiles(m,p,['followers','gained','reach','impr','inter','er','posts','visits'])}
    <div class="card"><div class="card-h"><div><h3>Toutes les marques</h3><div class="sub">Cliquez sur une ligne pour ouvrir ses statistiques détaillées. Tendance = portée quotidienne sur 30 jours.</div></div>
      <button class="btn sm" onclick="copyOverviewCSV()">Copier en CSV</button></div>
      <div style="overflow:auto"><table><thead><tr><th>Marque / compte</th>${cols.map(([k,l])=>`<th class="${sk.k===k?'sorted':''}" onclick="sortOv('${k}')">${l}${sk.k===k?(sk.dir<0?' ↓':' ↑'):''}</th>`).join('')}<th style="cursor:default">Tendance portée</th></tr></thead><tbody>
      ${rows.map(x=>`<tr class="click grp" onclick="go('analytics','${x.e.id}')"><td><div class="acc-cell"><div class="av" style="background:${x.e.color}">${initials(x.e.name)}</div>${esc(x.e.name)} <span class="muted" style="font-weight:400">· ${esc(x.e.sector)}</span></div></td>
          ${cols.map(([k])=>`<td>${cell(x.m,x.p,k)}${k==='reach'?' '+dcell(x.m,x.p):''}</td>`).join('')}<td>${sparkSVG(series(accsOf(x.e),'reach',bk),'#52514e')}</td></tr>
        ${x.subs.map(s=>`<tr class="click" onclick="S.nets={ig:false,fb:false,tt:false,li:false,yt:false};S.nets['${s.a.net}']=true;go('analytics','${x.e.id}')"><td style="padding-left:44px"><div class="acc-cell">${nb(s.a.net)}<span class="muted">${esc(s.a.handle)}</span></div></td>
          ${cols.map(([k])=>`<td class="muted">${cell(s.m,s.p,k)}${k==='reach'?' '+dcell(s.m,s.p):''}</td>`).join('')}<td>${sparkSVG(series([s.a],'reach',bk),css(NETS[s.a.net].color))}</td></tr>`).join('')}`).join('')}
      </tbody></table></div></div>
    <div class="grid g32">
      <div class="card"><h3>Portée par marque</h3><div class="sub">Somme des comptes sélectionnés, ${buckets(r).mode} par ${buckets(r).mode}</div>
        ${legend(activeNets().filter(n=>NETS[n].live).map(n=>[NETS[n].name,css(NETS[n].color)]))}
        <div class="chart-box lg"><canvas id="ovBrands"></canvas></div></div>
      <div class="card"><h3>Points d'attention</h3><div class="sub">Détectés automatiquement sur la période</div>
        <div class="alerts">${alerts.length?alerts.slice(0,8).map(a=>`<div class="alert" onclick="go('analytics','${a.e.id}')"><span class="ic" style="color:${a.c}">${a.ic}</span><span>${a.t}</span></div>`).join(''):'<div class="muted">Rien à signaler 👌</div>'}</div></div>
    </div>`;
  // chart : barres groupées par marque, une série par réseau
  const nets=activeNets().filter(n=>NETS[n].live);
  mkChart('ovBrands',{type:'bar',data:{labels:rows.map(x=>x.e.name),datasets:nets.map(n=>barDS(NETS[n].name,rows.map(x=>x.subs.filter(s=>s.a.net===n).reduce((t,s)=>t+s.m.reach,0)),css(NETS[n].color)))},
    options:baseOpts({indexAxis:'y',scales:{x:{grid:{color:css('--line')},border:{display:false},ticks:{color:css('--ink-2'),callback:v=>fmtC(v),maxTicksLimit:6}},y:{grid:{display:false},ticks:{color:css('--ink')}}}})});
}
function sortOv(k){ S.ovSort = S.ovSort.k===k?{k,dir:-S.ovSort.dir}:{k,dir:-1}; render(); }
function copyOverviewCSV(){
  const r=R(); const lines=[['Marque','Réseau','Compte','Abonnés','Évolution abonnés','Nouveaux abonnés','Portée','Vues','Interactions','Taux engagement','Publications','Visites profil','Clics site'].join(';')];
  ENTITIES.forEach(e=>accsOf(e).forEach(a=>{const m=metrics([a],r); lines.push([e.name,NETS[a.net].name,a.handle,m.followers,m.net,m.gained,m.reach,m.impr,m.inter,(m.er*100).toFixed(2).replace('.',','),m.posts,m.visits,m.clicks].join(';'))}));
  copy(lines.join('\n'),'Tableau copié (CSV) — collez-le dans Excel ou Sheets');
}

/* ============================== Analytics (marque) ============================== */
function vAnalytics(v){
  const e=ent(), r=R(), pr=prevRange(r), accs=accsOf(e);
  if(!accs.length){ v.innerHTML=`<div class="card empty">Aucun compte de cette marque sur les réseaux sélectionnés.</div>`; return; }
  const m=metrics(accs,r), p=pr&&metrics(accs,pr);
  const {b:bk,mode}=buckets(r);
  const ps=postsIn(accs,r);
  const top=[...ps].sort((a,b)=>b.er-a.er).slice(0,5);
  v.innerHTML = `${periodHeader(r)}
    ${kpiTiles(m,p)}
    <div class="grid g2">
      <div class="card"><h3>Évolution des abonnés</h3><div class="sub">Total en fin de ${mode}</div>${legend(accs.map(a=>[NETS[a.net].name,css(NETS[a.net].color)]))}<div class="chart-box"><canvas id="cFol"></canvas></div></div>
      <div class="card"><h3>Abonnés gagnés et perdus</h3><div class="sub">Par ${mode}, tous comptes sélectionnés</div>${legend([['Gagnés',css('--c3')],['Perdus',css('--c5')]])}<div class="chart-box"><canvas id="cGain"></canvas></div></div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><div><h3>Visibilité</h3><div class="sub">Par ${mode} et par réseau</div></div>
        <div class="seg">${[['reach','Portée'],['impr','Vues'],['visits','Visites'],['clicks','Clics']].map(([k,l])=>`<button class="${S.reachMetric===k?'on':''}" onclick="S.reachMetric='${k}';render()">${l}</button>`).join('')}</div></div>
        ${legend(accs.map(a=>[NETS[a.net].name,css(NETS[a.net].color)]))}<div class="chart-box"><canvas id="cReach"></canvas></div></div>
      <div class="card"><h3>Interactions par type</h3><div class="sub">Par ${mode} — J'aime / réactions, commentaires, partages, enregistrements</div>
        ${legend([['J\'aime',css('--c3')],['Commentaires',css('--c4')],['Partages',css('--c5')],['Enregistrements',css('--c7')]])}<div class="chart-box"><canvas id="cInter"></canvas></div></div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>Taux d'engagement</h3><div class="sub">Interactions ÷ portée, par ${mode}</div>${legend(accs.map(a=>[NETS[a.net].name,css(NETS[a.net].color)]))}<div class="chart-box"><canvas id="cEr"></canvas></div></div>
      <div class="card"><div class="card-h"><div><h3>Performance par format</h3><div class="sub">Moyenne par publication sur la période</div></div>
        <div class="seg">${[['er','Taux d\'eng.'],['reach','Portée'],['inter','Interactions']].map(([k,l])=>`<button class="${S.formatMetric===k?'on':''}" onclick="S.formatMetric='${k}';render()">${l}</button>`).join('')}</div></div>
        ${legend(accs.map(a=>[NETS[a.net].name,css(NETS[a.net].color)]))}<div class="chart-box"><canvas id="cFmt"></canvas></div></div>
    </div>
    <div class="grid g32">
      <div class="card"><div class="card-h"><div><h3>Top publications</h3><div class="sub">Classées par taux d'engagement</div></div><button class="btn sm" onclick="go('posts')">Toutes les publications →</button></div>
        ${postTable(top)}</div>
      <div class="card"><h3>Meilleurs moments pour publier</h3><div class="sub">Abonnés en ligne (moyenne), heure locale</div>${heatmap(e)}</div>
    </div>`;
  const labels=bk.map(b=>b.l);
  mkChart('cFol',{type:'line',data:{labels,datasets:accs.map(a=>lineDS(NETS[a.net].name,series([a],'followers',bk),css(NETS[a.net].color)))},options:baseOpts({scales:{...baseOpts().scales,y:{...baseOpts().scales.y,beginAtZero:false}}})});
  const g=series(accs,'gained',bk), l=series(accs,'lost',bk).map(x=>-x);
  mkChart('cGain',{type:'bar',data:{labels,datasets:[barDS('Gagnés',g,css('--c3')),barDS('Perdus',l,css('--c5'),{_fmt:v=>fmt(-v)})]},options:baseOpts({scales:{x:{...baseOpts().scales.x,stacked:true},y:{...baseOpts().scales.y,stacked:true}}})});
  mkChart('cReach',{type:'line',data:{labels,datasets:accs.map(a=>lineDS(NETS[a.net].name,series([a],S.reachMetric,bk),css(NETS[a.net].color)))},options:baseOpts()});
  const stk={x:{...baseOpts().scales.x,stacked:true},y:{...baseOpts().scales.y,stacked:true}};
  mkChart('cInter',{type:'bar',data:{labels,datasets:[['likes','J\'aime','--c3'],['comments','Commentaires','--c4'],['shares','Partages','--c5'],['saves','Enregistrements','--c7']].map(([k,lb,c])=>barDS(lb,series(accs,k,bk),css(c)))},options:baseOpts({scales:stk})});
  mkChart('cEr',{type:'line',data:{labels,datasets:accs.map(a=>{const it=series([a],'inter',bk), rc=series([a],'reach',bk); return lineDS(NETS[a.net].name,it.map((x,i)=>rc[i]?x/rc[i]:0),css(NETS[a.net].color),{_fmt:v=>pct(v,2)})})},
    options:baseOpts({scales:{...baseOpts().scales,y:{...baseOpts().scales.y,ticks:{...baseOpts().scales.y.ticks,callback:v=>pct(v,1)}}}})});
  // formats
  const fmts=[...new Set(accs.flatMap(a=>TYPES[a.net].map(t=>t.l)))];
  const fm=S.formatMetric;
  mkChart('cFmt',{type:'bar',data:{labels:fmts,datasets:accs.map(a=>barDS(NETS[a.net].name,fmts.map(fl=>{const pp=ps.filter(x=>x.acc===a.id&&typeLabel(x.type)===fl); if(!pp.length) return null; return fm==='er'?pp.reduce((t,x)=>t+x.inter,0)/pp.reduce((t,x)=>t+x.reach,0):pp.reduce((t,x)=>t+x[fm],0)/pp.length;}),css(NETS[a.net].color),{_fmt:v=>fm==='er'?pct(v,2):fmt(v)}))},
    options:baseOpts({interaction:{mode:'nearest',intersect:true},scales:{...baseOpts().scales,y:{...baseOpts().scales.y,ticks:{...baseOpts().scales.y.ticks,callback:v=>fm==='er'?pct(v,0):fmtC(v)}}}})});
  bindHeat();
}
function postTable(list){
  if(!list.length) return `<div class="empty">${t('Aucune publication sur cette période.')}</div>`;
  return `<div style="overflow:auto"><table><thead><tr>${['Publication','Date','Portée','Interactions',"Taux d'eng."].map(h=>`<th style="cursor:default">${t(h)}</th>`).join('')}</tr></thead><tbody>

}
function heatVals(e){
  const r=rng(hashStr(e.id+'heat')); const out=[];
  for(let d=0;d<7;d++){ const row=[]; for(let h=0;h<24;h++){ const we=d>=5;
    let v=.05+.55*Math.exp(-((h-(we?11:12.5))**2)/6)+.85*Math.exp(-((h-(we?19:20))**2)/5)+.25*Math.exp(-((h-8)**2)/3); if(h<6) v*=.3; v*= .85+r()*.3; if(we) v*=1.08; row.push(v);} out.push(row); }
  const mx=Math.max(...out.flat()); return out.map(r=>r.map(v=>v/mx));
}
function heatmap(e){
  const hl=LIVE.on?heatLive(e):null; const vals=hl?hl.vals:heatVals(e), days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'], steps=['--seq1','--seq2','--seq3','--seq4','--seq5','--seq6','--seq7'].map(css);
  let best={v:0}; vals.forEach((r,d)=>r.forEach((v,h)=>{if(v>best.v)best={v,d,h}}));
  const cell=v=>steps[Math.min(6,Math.floor(v*7))];
  return `<div class="heat"><div></div>${Array.from({length:24},(_,h)=>`<div class="hl">${h%3===0?h+'h':''}</div>`).join('')}
    ${vals.map((r,d)=>`<div class="rl">${days[d]}</div>${r.map((v,h)=>`<div class="c" style="background:${cell(v)}" data-tip="${days[d]} ${h}h–${h+1}h · ${Math.round(v*100)} % du pic d'activité"></div>`).join('')}`).join('')}</div>
    <div class="scale">Moins actifs ${steps.map(s=>`<i style="background:${s}"></i>`).join('')} Plus actifs</div>
    <div style="margin-top:12px;font-size:13px">⏱ Meilleur créneau : <b>${best.d!==undefined?`${days[best.d]} à ${best.h}h`:'—'}</b></div>${hl?`<div class="muted" style="font-size:12px;margin-top:6px">${hl.note}</div>`:''}`;
}
function bindHeat(){ document.querySelectorAll('[data-tip]').forEach(el=>{ el.onmouseenter=ev=>{const t=document.getElementById('tip');t.textContent=el.dataset.tip;t.style.display='block'}; el.onmousemove=ev=>{const t=document.getElementById('tip');t.style.left=(ev.clientX+12)+'px';t.style.top=(ev.clientY-30)+'px'}; el.onmouseleave=()=>document.getElementById('tip').style.display='none'; }); }

function demo(e){
  const r=rng(hashStr(e.id+'demo'));
  const ages=['13-17','18-24','25-34','35-44','45-54','55-64','65+'];
  const peak={food:2,fashion:2,fitness:2,hotel:3,auto:3}[e.theme]??2;
  const w=ages.map((_,i)=>Math.exp(-((i-peak)**2)/2.2)*(.8+r()*.4)); const tw=w.reduce((a,b)=>a+b,0);
  const fShare={food:.62,fashion:.74,fitness:.55,hotel:.58,auto:.32}[e.theme]??.5;
  const cities=[['Fort-de-France',.31],['Le Lamentin',.14],['Schœlcher',.09],['Le Robert',.06],['Ducos',.05],['Paris',.05],['Pointe-à-Pitre',.04],['Rivière-Salée',.03]].map(([c,v])=>[c,v*(.8+r()*.4)]);
  const countries=[['Martinique',.68],['France métropolitaine',.17],['Guadeloupe',.07],['Guyane',.03],['Canada',.02],['Autres',.03]];
  return {ages,women:w.map(x=>x/tw*fShare),men:w.map(x=>x/tw*(1-fShare)),fShare,cities:cities.sort((a,b)=>b[1]-a[1]),countries};
}

function formatTable(accs,ps){
  const rows=[]; accs.forEach(a=>TYPES[a.net].forEach(t=>{const pp=ps.filter(x=>x.acc===a.id&&x.type===t.k); if(!pp.length) return; const re=pp.reduce((s,x)=>s+x.reach,0), it=pp.reduce((s,x)=>s+x.inter,0); rows.push({a,t,n:pp.length,reach:re/pp.length,inter:it/pp.length,er:it/re});}));
  rows.sort((a,b)=>b.er-a.er); if(!rows.length) return `<div class="empty">${t('Aucune publication.')}</div>`;
  const mx=Math.max(...rows.map(r=>r.er));
  return `<table><thead><tr>${['Format','Publications','Portée moy.','Interactions moy.',"Taux d'eng."].map(h=>`<th style="cursor:default">${t(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><div class="acc-cell">${nb(r.a.net)} ${t(r.t.l)}</div></td><td>${r.n}</td><td>${fmt(r.reach)}</td><td>${fmt(r.inter)}</td><td><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><div style="width:80px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden"><div style="height:100%;width:${r.er/mx*100}%;background:${css(NETS[r.a.net].color)}"></div></div><b>${pct(r.er,2)}</b></div></td></tr>`).join('')}</tbody></table>`;
}
function insights(en,accs,r,m,p,ps){
  const out=[]; const ch=(a,b)=>b?(a-b)/b:null; const sg=x=>(x>=0?'+':'')+pct(x,1); const E=LOC==='en';
  out.push(E?`The community reaches <b>${fmt(m.followers)} followers</b> (${m.net>=0?'+':''}${fmt(m.net)} over the period, i.e. ${sg(m.growth)}).`
            :`La communauté atteint <b>${fmt(m.followers)} abonnés</b> (${m.net>=0?'+':''}${fmt(m.net)} sur la période, soit ${sg(m.growth)}).`);
  if(p){ const cr=ch(m.reach,p.reach), ci=ch(m.inter,p.inter);
    out.push(E?`Reach ${cr>=0?'grew':'fell'} by <b>${sg(cr)}</b> and interactions ${ci>=0?'grew':'fell'} by <b>${sg(ci)}</b> compared with the previous period.`
              :`La portée ${cr>=0?'progresse':'recule'} de <b>${sg(cr)}</b> et les interactions ${ci>=0?'progressent':'reculent'} de <b>${sg(ci)}</b> par rapport à la période précédente.`);
    const de=(m.er-p.er)*100; out.push(E?`Engagement rate stands at <b>${pct(m.er,2)}</b> (${de>=0?'+':''}${num(de,2)} pt).`:`Le taux d'engagement s'établit à <b>${pct(m.er,2)}</b> (${de>=0?'+':''}${num(de,2)} pt).`); }
  const byT={}; ps.forEach(x=>{const k=x.net+'|'+x.type; (byT[k]=byT[k]||{r:0,i:0,n:0,net:x.net,type:x.type}); byT[k].r+=x.reach; byT[k].i+=x.inter; byT[k].n++;});
  const ts=Object.values(byT).filter(x=>x.n>=2).map(x=>({...x,er:x.i/x.r})).sort((a,b)=>b.er-a.er);
  if(ts.length>1){ const f=ts[0], l=ts[ts.length-1];
    out.push(E?`Most engaging format: <b>${NETS[f.net].name} ${typeLabel(f.type)}</b> (${pct(f.er,2)} engagement over ${f.n} posts), versus ${pct(l.er,2)} for ${NETS[l.net].name} ${typeLabel(l.type)}. Recommendation: increase the share of ${typeLabel(f.type).toLowerCase()}s in the content plan.`
              :`Format le plus engageant : <b>${typeLabel(f.type)} ${NETS[f.net].name}</b> (${pct(f.er,2)} d'engagement sur ${f.n} publications), contre ${pct(l.er,2)} pour ${typeLabel(l.type)} ${NETS[l.net].name}. Recommandation : augmenter la part de ${typeLabel(f.type).toLowerCase()}s dans le planning.`); }
  const best=[...ps].sort((a,b)=>b.er-a.er)[0];
  if(best) out.push(E?`Best-performing post: “${esc(best.cap)}” (${NETS[best.net].name}, ${fd(best.day,{day:'numeric',month:'long'})}) with ${fmt(best.inter)} interactions and ${pct(best.er,2)} engagement.`
                     :`Publication la plus performante : « ${esc(best.cap)} » (${NETS[best.net].name}, ${fd(best.day,{day:'numeric',month:'long'})}) avec ${fmt(best.inter)} interactions et ${pct(best.er,2)} d'engagement.`);
  const days=E?['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']:['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const bd={}; ps.forEach(x=>{const d=dayDate(x.day).getUTCDay(); (bd[d]=bd[d]||{r:0,i:0}); bd[d].r+=x.reach; bd[d].i+=x.inter;});
  const bdl=Object.entries(bd).map(([d,v])=>({d,er:v.i/v.r})).sort((a,b)=>b.er-a.er);
  if(bdl.length>2) out.push(E?`Posts published on <b>${days[bdl[0].d]}</b> get the best engagement; <b>${days[bdl[bdl.length-1].d]}</b> is the weakest day.`
                             :`Les publications du <b>${days[bdl[0].d]}</b> obtiennent le meilleur engagement ; le <b>${days[bdl[bdl.length-1].d]}</b> est le jour le moins performant.`);
  const perW=m.posts/(m.days/7);
  out.push(E?`Posting frequency: <b>${num(perW,1)} posts / week</b>${perW<3?' — a steadier pace (3 to 5 per week) would help reach.':'.'}`
            :`Rythme de publication : <b>${num(perW,1)} publications / semaine</b>${perW<3?' — un rythme plus soutenu (3 à 5 par semaine) aiderait la portée.':'.'}`);
  return out;
}

  return accs.filter(a=>a.loadedFrom>s0).map(a=>({a,s:s0}));
}
function loadingCard(){ return `<div class="card empty"><div class="spinner"></div><b>Chargement des statistiques depuis Meta…</b><div class="muted" id="loadStatus" style="margin-top:6px">${esc(LIVE.status)}</div><div class="muted" style="margin-top:10px;font-size:12px">La première fois, comptez quelques secondes par compte. Les périodes déjà chargées s'affichent ensuite instantanément.</div></div>`; }
async function runLoads(list){
  LIVE.busy=true;
  try{
    for(const {a,s} of list){
      const e=a.loadedFrom-1; if(e<s) continue;
      LIVE.status=`${NETS[a.net].name} · ${a.handle} · ${fd(s)} → ${fd(e)}`; const el=document.getElementById('loadStatus'); if(el) el.textContent=LIVE.status;
      if(a.net==='fb'){ await loadFbRange(a,s,e); await loadFbPosts(a,s,e); } else { await loadIgRange(a,s,e); await loadIgMedia(a,s); }
      a.loadedFrom=s; fixFollowers(a);
    }
    if(S.view==='audience') await loadDemo(ent());
  }catch(err){
    if(err.code===190){ LIVE.busy=false; toast('Session Facebook expirée : reconnectez-vous'); bootWelcome(); return; }
    diag('Orbit','Chargement',false,err.message); toast('Erreur de chargement : voir Diagnostic API');
  }
  LIVE.busy=false; render();
}

/* ---------- Connexion ---------- */
function liveLogin(){
  const c=liveCfg(); if(!c.appId){ bootWelcome(); return; }
  if(!window.FB){ toast('Le SDK Facebook se charge, réessayez dans une seconde'); loadSDK().catch(err=>toast(err.message)); return; }
  const opts = c.configId ? {config_id:c.configId} : {scope:SCOPES, return_scopes:true, auth_type:'rerequest'};
  FB.login(resp=>{ if(resp&&resp.authResponse) afterLogin(); else toast('Connexion annulée'); }, opts);
}
async function afterLogin(){
  bootMsg('Connexion réussie — récupération de vos pages et comptes Instagram…');
  try{
    const me=await api('/me',{fields:'id,name'}); LIVE.user=me;
    let r=await api('/me/accounts',{fields:'id,name,access_token,category,followers_count,fan_count,instagram_business_account{id,username,followers_count,media_count}',limit:100});
    let pages=(r.data||[]).slice(); let guard=0; while(r.paging&&r.paging.next&&guard++<10){ r=await getUrl(r.paging.next); pages=pages.concat(r.data||[]); }
    diag('Meta','Pages accessibles',pages.length>0,`${pages.length} page(s) · utilisateur ${me.name}`);
    if(!pages.length){ bootMsg(`Connecté en tant que <b>${esc(me.name)}</b>, mais aucune Page Facebook n'est accessible.<br><br>Dans la fenêtre de connexion Facebook, cliquez sur « Modifier les paramètres » et cochez les Pages (et comptes Instagram) à autoriser.<br><br><button class="btn pri" onclick="liveLogin()">Réessayer</button> <button class="btn" onclick="startDemo()">Voir la démo</button>`, true); return; }
    const colors=['#2a78d6','#c2410c','#0f766e','#1d4ed8','#374151','#7c3aed','#b45309','#0e7490','#be123c','#15803d'];
    Object.keys(DATA).forEach(k=>delete DATA[k]); Object.keys(POSTS).forEach(k=>delete POSTS[k]);
    const camps=store.get('camps',{});
    ENTITIES = pages.sort((a,b)=>a.name.localeCompare(b.name)).map((p,k)=>{
      const e={id:'p'+p.id,name:p.name,sector:p.category||'Page Facebook',color:colors[k%colors.length],theme:'food',accounts:[],campaigns:(camps['p'+p.id]||[]).slice()};
      e.accounts.push(mkAcc(e,{id:'fb-'+p.id,net:'fb',handle:p.name,ext:p.id,token:p.access_token,followersNow:p.followers_count||p.fan_count||0}));
      const ig=p.instagram_business_account; if(ig) e.accounts.push(mkAcc(e,{id:'ig-'+ig.id,net:'ig',handle:'@'+ig.username,ext:ig.id,token:p.access_token,followersNow:ig.followers_count||0}));
      return e; });
    LIVE.on=true; store.set('mode','live'); S.client=null; S.entity=ENTITIES[0].id; S.period.key='30d'; S.report=null; S.nets={ig:true,fb:true,tt:false,li:false,yt:false};
    document.getElementById('boot').style.display='none'; go('overview');
  }catch(err){ diag('Meta','Connexion',false,err.message); bootMsg(`Erreur : ${esc(err.message)}<br><br><button class="btn pri" onclick="liveLogin()">Réessayer</button> <button class="btn" onclick="bootWelcome()">Retour</button>`, true); }
}
function liveLogout(){ try{ if(window.FB) FB.logout(()=>{}); }catch(e){} LIVE.on=false; store.set('mode',''); location.hash=''; location.reload(); }
function liveRefresh(){ ENTITIES.forEach(e=>{ e.demo=undefined; e.online=undefined; e.accounts.forEach(a=>{ const ent0=ENTITIES.find(x=>x.id===a.ent); Object.assign(a,{has:{},loadedFrom:N,mediaSeen:new Set(),mediaFrom:N,igValid:undefined,mediaValid:undefined}); KEYS.forEach(k=>DATA[a.id][k].fill(0)); POSTS[a.id]=[]; }); }); toast('Données rechargées depuis Meta'); render(); }

/* ---------- Écran d'accueil ---------- */
function bootMsg(html, final){ const b=document.getElementById('boot'); b.style.display='grid'; b.innerHTML=`<div class="boot-card" style="max-width:520px;text-align:center">${final?'':'<div class="spinner"></div>'}<div>${html}</div></div>`; }
function bootWelcome(){
  const c=liveCfg(); const b=document.getElementById('boot'); b.style.display='grid';
  b.innerHTML=`<div class="boot-wrap"><div class="logo" style="color:var(--ink);justify-content:center;font-size:22px"><div class="logo-mark"></div>Orbit</div>
  <p class="muted" style="text-align:center;margin:6px 0 22px">Les statistiques Facebook et Instagram de toutes vos marques, en un clic.</p>
  <div class="boot-grid">
    <div class="boot-card"><h3>Connecter mes comptes</h3><p class="muted">Connexion Facebook : Orbit lit les statistiques des Pages et comptes Instagram professionnels que vous gérez. Lecture seule — rien n'est publié ni modifié, et aucun jeton n'est conservé après la fermeture de l'onglet.</p>
      ${c.appId?`<button class="btn pri fb-btn" onclick="liveLogin()">Se connecter avec Facebook</button><div class="muted" style="font-size:12px;margin-top:10px">Application Meta ${esc(c.appId)} · <a href="#" onclick="event.preventDefault();openMetaConfig()">modifier</a></div>`
      :`<form class="form" onsubmit="event.preventDefault();saveMetaConfig(this)"><div class="field"><label>Identifiant de l'application Meta (App ID)</label><input type="text" name="appId" required placeholder="ex. 123456789012345"></div><div class="field"><label>Configuration ID (Facebook Login for Business, optionnel)</label><input type="text" name="configId" placeholder="laisser vide si non utilisé"></div><button class="btn pri">Enregistrer</button></form>`}
    </div>
    <div class="boot-card"><h3>Explorer la démo</h3><p class="muted">5 marques fictives avec 2 ans de données simulées, pour découvrir toutes les fonctions (rapports FR/EN, espace client, campagnes…).</p><button class="btn" onclick="startDemo()">Ouvrir la démo</button></div>
  </div></div>`;
}
function openMetaConfig(){ const c=liveCfg();
  openModal(`<h3>Application Meta</h3><form class="form" onsubmit="event.preventDefault();saveMetaConfig(this);closeModal()">
    <div class="field"><label>App ID</label><input type="text" name="appId" required value="${esc(c.appId)}"></div>
    <div class="field"><label>Configuration ID (optionnel)</label><input type="text" name="configId" value="${esc(c.configId)}"></div>
    <div class="field"><label>Version de l'API</label><input type="text" name="apiVersion" value="${esc(c.apiVersion)}"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn pri">Enregistrer et recharger</button></div></form>`); }
function saveMetaConfig(f){ const c=store.get('meta',{}); c.appId=f.appId.value.trim(); c.configId=f.configId.value.trim(); if(f.apiVersion) c.apiVersion=f.apiVersion.value.trim()||'v25.0'; store.set('meta',c); store.set('mode','live'); location.reload(); }
function startDemo(){ store.set('mode','demo'); document.getElementById('boot').style.display='none'; LIVE.on=false; render(); }

/* ---------- Vue Diagnostic ---------- */
function vDiagnostic(v){
  const c=liveCfg(); const ok=LIVE.diag.filter(d=>d.ok).length, ko=LIVE.diag.length-ok;
  v.innerHTML=`<div class="kpis">
    <div class="kpi"><div class="l">Utilisateur Facebook</div><div class="v" style="font-size:18px">${esc((LIVE.user||{}).name||'—')}</div></div>
    <div class="kpi"><div class="l">Pages / comptes</div><div class="v">${ENTITIES.length} / ${ENTITIES.reduce((a,e)=>a+e.accounts.length,0)}</div></div>
    <div class="kpi"><div class="l">Appels réussis</div><div class="v up">${ok}</div></div>
    <div class="kpi"><div class="l">Appels en erreur</div><div class="v ${ko?'down':''}">${ko}</div></div></div>
  <div class="card"><div class="card-h"><div><h3>Journal des appels à l'API Meta</h3><div class="sub">App ${esc(c.appId)} · API ${esc(c.apiVersion)} · les erreurs indiquent les métriques que Meta ne fournit pas pour ce compte ou cette version.</div></div>
    <div style="display:flex;gap:8px"><button class="btn sm" onclick="copyDiag()">Copier le diagnostic</button><button class="btn sm" onclick="liveRefresh()">Recharger les données</button></div></div>
    <div style="overflow:auto"><table><thead><tr><th style="cursor:default">Heure</th><th style="cursor:default;text-align:left">Source</th><th style="cursor:default;text-align:left">Appel</th><th style="cursor:default;text-align:left">Résultat</th></tr></thead><tbody>
    ${LIVE.diag.map(d=>`<tr><td class="muted">${d.t}</td><td style="text-align:left">${esc(d.kind)}</td><td style="text-align:left;white-space:normal">${esc(d.what)}</td><td style="text-align:left;white-space:normal"><span class="${d.ok?'up':'down'}">${d.ok?'✓':'✕'}</span> ${esc(d.msg)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucun appel pour l\'instant.</td></tr>'}
    </tbody></table></div></div>`;
}
function copyDiag(){ copy(LIVE.diag.map(d=>`${d.t}\t${d.kind}\t${d.ok?'OK':'ERREUR'}\t${d.what}\t${d.msg}`).join('\n'),'Diagnostic copié'); }

/* ---------- Démarrage ---------- */
function boot(){
  const h=location.hash.slice(1); if(VIEWS.find(v=>v.id===h)) S.view=h;
  const mode=store.get('mode',''), c=liveCfg();
  if(mode==='demo'){ render(); return; }
  if(c.appId){
    bootMsg('Connexion à Meta…');
    loadSDK().then(()=>{ FB.getLoginStatus(r=>{ if(r&&r.status==='connected') afterLogin(); else bootWelcome(); }); })
      .catch(err=>{ bootMsg(`${esc(err.message)}<br><br><button class="btn" onclick="startDemo()">Voir la démo</button>`, true); });
    return;
  }
  bootWelcome();
}
boot();

</script>
</body>
</html>
